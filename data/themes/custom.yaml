# HugoBlox Theme Pack
# https://docs.hugoblox.com

hugoblox:
  meta:
    format: "hugoblox-theme@1"
    name: "Minimal"
    vendor: "hugoblox"
    version: "1.0.0"
    license: "MIT"
    description: "Clean, GitHub-inspired design"

  type: "dual"

  light:
    # Inspired by GitHub Light
    colors:
      primary: "#15584e" # GitHub Blue
      secondary: "#15584e" # GitHub Green
      neutral: "#24292f" # GitHub Dark Gray (Text)
    surfaces:
      background: "#ffffff"
      foreground: "#1E1B18"
      header:
        background: "#f6f8fa" # GitHub Header Gray
        foreground: "#1E1B18"
      footer:
        background: "#ffffff" # Clean
        foreground: "#1E1B18" # Muted text

  dark:
    # Inspired by GitHub Dark
    colors:
      primary: "#3ACFB9"
      secondary: "#FF8370"
      neutral: "#f6f8fa" # GitHub Light Gray (Text)
    surfaces:
      background: "#0d1117" # GitHub Dimmed BG
      foreground: "#f6f8fa"
      header:
        background: "#161b22" # GitHub Dark Header
        foreground: "#f6f8fa"
      footer:
        background: "#0d1117"
        foreground: "#cccccc" # Muted text
